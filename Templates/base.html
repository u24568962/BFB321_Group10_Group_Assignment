<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <!-- the next part is to display properly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- the next part is so we can use this base in our other pages-->
    <title>{% block title %}Lebombo Border Post{% endblock %}</title>

    <!-- this is to import Bootstrap CSS framework for ready-made styling like buttons and so on-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- this part links our own separate css file that was made aesthetic with copilot-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>


<body>
    <!-- Now this is the standard navigation bar using Bootstrap (navbar is a Bootstrap Class) -->
    <nav class="navbar navbar-dark">
        <!--the container keeps the content inside the nav bar centred-->
        <div class="container">
            <!-- span groups text together usually and this styles the name Lebombo Border Post-->
            <span class="navbar-brand mb-0 h1">
                <!-- this group creates the L that acts as my website's logo-->
                <span class="brand-mark" aria-hidden="true">L</span>
                <span>Lebombo Border Post</span>
            </span>
            <span class="navbar-note">Border crossing · Mozambique</span>
        </div>
    </nav>

    <!-- Content from other pages -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
